name: Deploy URL shortener to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-app/url-shortner-app/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: client-app/url-shortner-app
      - name: Build client
        run: npm run build
        working-directory: client-app/url-shortner-app
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: client-app/url-shortner-app/dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
